<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple User Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-users"></i> User Management</h1>
            <p class="subtitle">A simple CRUD application with Node.js and MySQL</p>
        </header>

        <div class="main-content">
            <div class="form-section">
                <h2><i class="fas fa-user-plus"></i> Add/Edit User</h2>
                <form id="userForm">
                    <input type="hidden" id="userId">
                    
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Name:</label>
                        <input type="text" id="name" required placeholder="Enter full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email:</label>
                        <input type="email" id="email" required placeholder="Enter email address">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Add User
                        </button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">
                            <i class="fas fa-times"></i> Cancel Edit
                        </button>
                    </div>
                </form>
            </div>

            <div class="users-section">
                <h2><i class="fas fa-list"></i> Users List</h2>
                <div class="user-count">
                    <span id="userCount">Loading...</span> users found
                </div>
                <div id="usersList" class="users-list">
                    <div class="loading">Loading users...</div>
                </div>
            </div>
        </div>

        <div class="notification" id="notification"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
