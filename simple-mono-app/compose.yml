version: "3.8"

services:
  db:
    image: mysql:8.4
    # environment:
    #   MYSQL_ROOT_PASSWORD: rootpassword
    #   MYSQL_DATABASE: simple_app_db
    volumes:
      - db-vol:/var/lib/mysql
    networks:
      - my-net

  be:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - db
    networks:
      - my-net

  fe:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - my-net

networks:
  my-net:
    driver: bridge

volumes:
  db-vol:
