<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microservices App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Microservices Application</h1>
  <div id="app">
    <div id="users">
      <h2>Users</h2>
      <button id="loadUsers">Load Users</button>
      <ul id="userList"></ul>
    </div>
    <div id="products">
      <h2>Products</h2>
      <button id="loadProducts">Load Products</button>
      <ul id="productList"></ul>
    </div>
    <div id="orders">
      <h2>Orders</h2>
      <button id="loadOrders">Load Orders</button>
      <ul id="orderList"></ul>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
