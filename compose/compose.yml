version: "3.8"

services:
  fe:
    image: nginx
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost", "||", "exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 10s

  fe1:
    image: nginx
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]      # custome Health check nothing but chsnging below feelds
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 10s
  fe2:
    image: nginx:latest
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost || exit 1"]  # Default healthcheck below feelds are not mandatory 
                                                                  #for default it both behaves the same way
